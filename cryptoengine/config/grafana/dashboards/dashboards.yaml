# ============================================================
# Grafana Dashboard Provisioning — 재설계 폴더 구조
# 작성: 2026-05-02 (Grafana 재설계 Task 1)
# ============================================================

apiVersion: 1

providers:
  - name: 'Trading'
    orgId: 1
    folder: 'Trading'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/trading

  - name: 'Operations'
    orgId: 1
    folder: 'Operations'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/operations

  - name: 'Analysis'
    orgId: 1
    folder: 'Analysis'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/analysis

  - name: 'Mobile'
    orgId: 1
    folder: 'Mobile'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/mobile
