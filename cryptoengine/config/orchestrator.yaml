# ============================================================
# Strategy Orchestrator Configuration
# ============================================================

orchestrator:
  version: "2.0"
  # How often the orchestrator evaluates risk and reallocates (seconds)
  evaluation_interval_seconds: 300
  # Portfolio snapshot interval (seconds)
  portfolio_snapshot_interval_seconds: 900

# ── Strategy Allocation ───────────────────────────────────────
# Single-strategy model (regime allocation removed 2026-05-25):
# supertrend always receives 100% of available equity. The strategy itself
# deploys 95% × 3x leverage internally. Weights are hardcoded in
# WeightManager.FIXED_WEIGHTS — no per-regime matrix.

# ── Kill Switch ───────────────────────────────────────────────
kill_switch:
  enabled: true

  # Portfolio drawdown thresholds
  max_daily_drawdown_pct: 5.0
  max_weekly_drawdown_pct: 10.0
  max_monthly_drawdown_pct: 15.0

  # Single-day loss limit (USD)
  daily_loss_limit_usd: 1_000

  # Market-wide circuit breaker: halt if BTC drops this much in given window
  btc_crash_pct: 15.0
  btc_crash_window_hours: 24

  # Halt if exchange API errors exceed threshold in window
  max_api_errors: 50
  api_error_window_minutes: 10

  # Halt if execution latency exceeds threshold (milliseconds)
  max_execution_latency_ms: 5_000

  # Actions on kill switch activation
  actions:
    - close_all_positions
    - cancel_all_orders
    - notify_telegram
    - log_critical

  # Manual re-enable required after kill switch trips
  require_manual_reset: true

  # Cooldown before strategies can be re-enabled (minutes)
  cooldown_minutes: 60

  # ── Phase 5 소액 실전 임계값 ────────────────────────────────
  # BYBIT_TESTNET=false 또는 PHASE5_MODE=true 시 오케스트레이터가 이 값으로
  # KillSwitch를 초기화해야 한다. 절대값 + 퍼센트 AND 조건으로 노이즈 오발동 방지.
  phase5:
    # 퍼센트 임계값 완화 (소액 자본 노이즈 대응)
    max_daily_drawdown_pct: 5.0     # 1% → 5%
    max_weekly_drawdown_pct: 10.0   # 3% → 10%
    max_monthly_drawdown_pct: 15.0  # 5% → 15%
    # 절대값 임계값 ($200 기준)
    max_daily_loss_abs_usd: 10      # $200의 5%
    max_weekly_loss_abs_usd: 20     # $200의 10%
    max_monthly_loss_abs_usd: 30    # $200의 15%
    # 발동 조건: pct AND abs 둘 다 초과 시 (OR가 아닌 AND)
    trigger_mode: and               # 'and' | 'or' (기본: and)

# ── Portfolio Risk ────────────────────────────────────────────
risk:
  # Hard cap on total capital the orchestrator will deploy (USD).
  # Set to 1_000 for Phase 4 testnet trial run.
  # Set to null (or remove) to use full account balance.
  max_capital_usd: 1_000
  # Maximum total leverage across all strategies
  max_total_leverage: 5.0
  # Single-strategy model: supertrend may use 100% of equity
  max_single_strategy_pct: 100.0
  # No cash reserve enforced (always fully deployed)
  min_cash_reserve_pct: 0.0
  # Sharpe ratio calculation window (days)
  sharpe_window_days: 30
  # Risk-free rate for Sharpe calculation (annualized)
  risk_free_rate: 0.05

# ── Notifications ─────────────────────────────────────────────
notifications:
  on_rebalance: true
  on_kill_switch: true
  status_report_interval_hours: 6
