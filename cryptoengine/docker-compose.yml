# Single-process stack: postgres + bot + pg-backup.
# Rename over docker-compose.yml at cutover. Project name (directory name `cryptoengine`)
# and the `pgdata` / `pg-backups` volumes are unchanged, so existing data is reused.
# Build context is this directory (as in the old compose); the Dockerfile lives in bot/.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: cryptoengine
      POSTGRES_USER: cryptoengine
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoengine -d cryptoengine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    # Longer than the order timeout (420 s) so an in-flight order finishes before exit.
    stop_grace_period: 450s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 384M

  pg-backup:
    image: postgres:16-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: cryptoengine
      DB_USER: cryptoengine
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required in .env}
      BACKUP_CRON: ${BACKUP_CRON:-0 17 * * *}   # 매일 02:00 KST
      RUN_ON_STARTUP: ${BACKUP_ON_STARTUP:-false}
    volumes:
      - ./scripts/sh/pg_backup.sh:/scripts/pg_backup.sh:ro
      - ./scripts/sh/pg_backup_entrypoint.sh:/scripts/pg_backup_entrypoint.sh:ro
      - pg-backups:/backups
    entrypoint: ["sh", "/scripts/pg_backup_entrypoint.sh"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  pgdata:
    driver: local
  pg-backups:
    driver: local
