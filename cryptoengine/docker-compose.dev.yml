version: "3.9"

# Development overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  market-data:
    build:
      target: development
    environment:
      LOG_LEVEL: DEBUG
      ENVIRONMENT: testnet
    volumes:
      - ./services/market-data/src:/app/src:ro
    ports:
      - "5678:5678"   # debugpy

  strategy-orchestrator:
    build:
      target: development
    environment:
      LOG_LEVEL: DEBUG
    volumes:
      - ./services/orchestrator/src:/app/src:ro
    ports:
      - "5679:5678"   # debugpy

  execution-engine:
    build:
      target: development
    environment:
      LOG_LEVEL: DEBUG
    volumes:
      - ./services/execution/src:/app/src:ro
    ports:
      - "5680:5678"   # debugpy

  telegram-bot:
    build:
      target: development
    environment:
      LOG_LEVEL: DEBUG
    volumes:
      - ./services/telegram-bot/src:/app/src:ro
    ports:
      - "5685:5678"   # debugpy
