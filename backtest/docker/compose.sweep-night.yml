# Low-priority night overlay for ATR-SL-only re-sweep.
# 00:00–06:00 KST: 6 workers on cores 3–7. Production keeps cores 0–2.
services:
  backtester:
    cpus: 4.00
    cpu_shares: 256
    cpuset: "3,4,5,6,7"
    mem_limit: 5g
    memswap_limit: 5g
    oom_score_adj: 800
    deploy:
      resources:
        limits:
          cpus: "4.00"
          memory: 5G
