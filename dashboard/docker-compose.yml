name: bitmania-dashboard

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cryptoengine
      DB_USER: cryptoengine
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD:-***REMOVED***}@redis:6379
      PROMETHEUS_URL: http://prometheus:9090
      DASHBOARD_PORT: ${DASHBOARD_PORT:-3000}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    networks:
      - cryptoengine_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  cryptoengine_default:
    external: true
